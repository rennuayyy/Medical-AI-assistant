<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Medical Assistant</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary-color: #9d7dd8;
        --primary-dark: #7b5fb2;
        --primary-light: #e6deff;
        --secondary-color: #ffffff;
        --text-color: #333333;
        --gray-light: #f5f5f5;
        --gray-medium: #e0e0e0;
        --success-color: #4caf50;
        --warning-color: #ff9800;
        --danger-color: #f44336;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #f5f3ff 0%, #ffffff 100%);
        min-height: 100vh;
        color: var(--text-color);
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 20px;
      }

      header {
        background: var(--secondary-color);
        box-shadow: 0 2px 10px rgba(157, 125, 216, 0.1);
        margin-bottom: 30px;
        border-radius: 15px;
        padding: 25px;
      }

      h1 {
        color: var(--primary-color);
        font-size: 2.5em;
        text-align: center;
        margin-bottom: 20px;
      }

      .nav-tabs {
        display: flex;
        gap: 10px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .nav-tab {
        padding: 12px 24px;
        background: var(--gray-light);
        border: none;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 16px;
        color: var(--text-color);
      }

      .nav-tab.active {
        background: var(--primary-color);
        color: var(--secondary-color);
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(157, 125, 216, 0.3);
      }

      .nav-tab:hover:not(.active) {
        background: var(--primary-light);
      }

      .tab-content {
        display: none;
        animation: fadeIn 0.3s ease;
      }

      .tab-content.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Dashboard Styles */
      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
      }

      .stat-card {
        background: var(--secondary-color);
        border-radius: 15px;
        padding: 25px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        transition: transform 0.3s ease;
      }

      .stat-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 6px 25px rgba(157, 125, 216, 0.2);
      }

      .stat-value {
        font-size: 2.5em;
        font-weight: bold;
        color: var(--primary-color);
        margin-bottom: 10px;
      }

      .stat-label {
        color: #666;
        font-size: 1.1em;
      }

      /* Form Styles */
      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: var(--primary-dark);
        font-weight: 500;
      }

      input[type="text"],
      input[type="file"],
      select,
      textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid var(--gray-medium);
        border-radius: 10px;
        font-size: 16px;
        transition: border-color 0.3s ease;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: var(--primary-color);
      }

      .btn {
        padding: 12px 30px;
        background: var(--primary-color);
        color: var(--secondary-color);
        border: none;
        border-radius: 25px;
        cursor: pointer;
        font-size: 16px;
        transition: all 0.3s ease;
        display: inline-block;
      }

      .btn:hover {
        background: var(--primary-dark);
        transform: translateY(-2px);
        box-shadow: 0 4px 15px rgba(157, 125, 216, 0.3);
      }

      .btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      /* Image Analysis Styles */
      .upload-area {
        border: 3px dashed var(--primary-color);
        border-radius: 15px;
        padding: 40px;
        text-align: center;
        background: var(--primary-light);
        margin: 20px 0;
      }

      .result-box {
        background: var(--secondary-color);
        border-radius: 15px;
        padding: 25px;
        margin-top: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      .preview-image {
        max-width: 100%;
        max-height: 400px;
        border-radius: 10px;
        margin: 20px auto;
        display: block;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
      }

      /* Chat Styles */
      .chat-container {
        background: var(--secondary-color);
        border-radius: 15px;
        height: 500px;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .message {
        padding: 12px 18px;
        border-radius: 15px;
        max-width: 70%;
        word-wrap: break-word;
      }

      .message.user {
        background: var(--primary-color);
        color: var(--secondary-color);
        align-self: flex-end;
        border-bottom-right-radius: 5px;
      }

      .message.bot {
        background: var(--gray-light);
        align-self: flex-start;
        border-bottom-left-radius: 5px;
      }

      .chat-input {
        display: flex;
        padding: 20px;
        border-top: 1px solid var(--gray-medium);
        gap: 10px;
      }

      .chat-input input {
        flex: 1;
      }

      /* Table Styles */
      .table-container {
        background: var(--secondary-color);
        border-radius: 15px;
        overflow: hidden;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        margin-top: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      th {
        background: var(--primary-color);
        color: var(--secondary-color);
        padding: 15px;
        text-align: left;
      }

      td {
        padding: 15px;
        border-bottom: 1px solid var(--gray-medium);
      }

      tr:hover {
        background: var(--gray-light);
      }

      /* Loading Spinner */
      .loader {
        border: 4px solid var(--gray-light);
        border-top: 4px solid var(--primary-color);
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      .alert {
        padding: 15px;
        border-radius: 10px;
        margin: 20px 0;
      }

      .alert-success {
        background: #e8f5e9;
        color: var(--success-color);
        border: 1px solid var(--success-color);
      }

      .alert-error {
        background: #ffebee;
        color: var(--danger-color);
        border: 1px solid var(--danger-color);
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        .container {
          padding: 10px;
        }

        h1 {
          font-size: 1.8em;
        }

        .nav-tabs {
          flex-direction: column;
        }

        .nav-tab {
          width: 100%;
          text-align: center;
        }

        .message {
          max-width: 85%;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🏥 AI Medical Assistant</h1>
        <nav class="nav-tabs">
          <button class="nav-tab active" onclick="switchTab('dashboard')">
            📊 Dashboard
          </button>
          <button class="nav-tab" onclick="switchTab('image-analysis')">
            🔬 Image Analysis
          </button>
          <button class="nav-tab" onclick="switchTab('chatbot')">
            💬 AI Doctor Chat
          </button>
          <button class="nav-tab" onclick="switchTab('patient-search')">
            🔍 Patient Search
          </button>
        </nav>
      </header>

      <!-- Dashboard Tab -->
      <div id="dashboard" class="tab-content active">
        <h2 style="color: var(--primary-color); margin-bottom: 20px">
          📊 สถิติภาพรวม
        </h2>
        <div class="stats-grid" id="statsGrid">
          <div class="loader"></div>
        </div>
      </div>

      <!-- Image Analysis Tab -->
      <div id="image-analysis" class="tab-content">
        <h2 style="color: var(--primary-color); margin-bottom: 20px">
          🔬 วิเคราะห์ภาพทางการแพทย์
        </h2>
        <div class="form-group">
          <label>ประเภทการวิเคราะห์</label>
          <select id="analysisType">
            <option value="X-ray">X-ray</option>
            <option value="Blood">Blood Test</option>
          </select>
        </div>
        <div class="upload-area">
          <input
            type="file"
            id="imageFile"
            accept="image/*"
            onchange="previewImage(event)"
          />
          <p style="color: var(--primary-color); margin-top: 15px">
            📁 เลือกไฟล์รูปภาพเพื่อวิเคราะห์
          </p>
        </div>
        <img id="imagePreview" class="preview-image" style="display: none" />
        <button class="btn" onclick="analyzeImage()">🔍 วิเคราะห์รูปภาพ</button>
        <div id="analysisResult"></div>
      </div>

      <!-- Chatbot Tab -->
      <div id="chatbot" class="tab-content">
        <h2 style="color: var(--primary-color); margin-bottom: 20px">
          💬 ปรึกษาหมอ AI
        </h2>
        <div class="chat-container">
          <div class="chat-messages" id="chatMessages">
            <div class="message bot">
              สวัสดีครับ ผมคือ AI Medical Assistant
              พร้อมให้คำปรึกษาด้านสุขภาพแล้วครับ
            </div>
          </div>
          <div class="chat-input">
            <input
              type="text"
              id="chatInput"
              placeholder="พิมพ์ข้อความของคุณ..."
              onkeypress="if (event.key === 'Enter') sendMessage();"
            />
            <button class="btn" onclick="sendMessage()">📤 ส่ง</button>
          </div>
        </div>
      </div>

      <!-- Patient Search Tab -->
      <div id="patient-search" class="tab-content">
        <h2 style="color: var(--primary-color); margin-bottom: 20px">
          🔍 ค้นหาข้อมูลผู้ป่วย
        </h2>
        
        <div class="form-group" style="display: flex; gap: 10px;">
          <select id="searchType" style="width: 200px;">
            <option value="name">ค้นหาจากชื่อ</option>
            <option value="condition">ค้นหาจากโรคประจำตัว</option>
            <option value="blood_type">ค้นหาจากกรุ๊ปเลือด</option>
          </select>
          <input
            type="text"
            id="searchQuery"
            placeholder="พิมพ์คำค้นหา (เช่น ชื่อ, Cancer, O+)..."
            onkeyup="if (event.key === 'Enter') searchPatients();"
            style="flex: 1;"
          />
        </div>
        
        <button class="btn" onclick="searchPatients()">🔍 ค้นหา</button>
        <div id="searchResults"></div>
      </div>

    <script>
      const API_URL = "http://localhost:8000";
      let sessionId = generateSessionId();

      // Generate unique session ID
      function generateSessionId() {
        return (
          "session_" +
          Date.now() +
          "_" +
          Math.random().toString(36).substr(2, 9)
        );
      }

      // Switch tabs
      function switchTab(tabName) {
        const tabs = document.querySelectorAll(".tab-content");
        const navTabs = document.querySelectorAll(".nav-tab");

        tabs.forEach((tab) => {
          tab.classList.remove("active");
        });

        navTabs.forEach((navTab) => {
          navTab.classList.remove("active");
        });

        document.getElementById(tabName).classList.add("active");
        event.target.classList.add("active");

        // Load data when switching to dashboard
        if (tabName === "dashboard") {
          loadDashboard();
        }
      }

      // Load Dashboard Stats
      async function loadDashboard() {
        const statsGrid = document.getElementById("statsGrid");
        statsGrid.innerHTML = '<div class="loader"></div>';

        try {
          const response = await fetch(`${API_URL}/patient/stats`);
          const data = await response.json();

          // เช็คว่า API ส่งข้อมูล success กลับมาหรือไม่
          if (data.success && data.stats) {
            
            // หาโรคที่พบมากที่สุดจาก Object conditions
            const conditions = data.stats.conditions;
            const topCondition = Object.keys(conditions).length > 0 ? Object.keys(conditions)[0] : "ไม่มีข้อมูล";

            // หากรุ๊ปเลือดที่พบมากที่สุด
            const bloodTypes = data.stats.blood_types;
            const topBloodType = Object.keys(bloodTypes).length > 0 ? Object.keys(bloodTypes)[0] : "-";

            // อัปเดตข้อมูลบนการ์ด โดยใช้ข้อมูลจาก data.stats
            statsGrid.innerHTML = `
              <div class="stat-card">
                  <div class="stat-value">${data.stats.total_patients.toLocaleString()}</div>
                  <div class="stat-label">👥 ผู้ป่วยทั้งหมด</div>
              </div>
              <div class="stat-card">
                  <div class="stat-value">${Math.round(data.stats.avg_age)} ปี</div>
                  <div class="stat-label">🎂 อายุเฉลี่ยผู้ป่วย</div>
              </div>
              <div class="stat-card">
                  <div class="stat-value" style="font-size: 1.8em;">${topCondition}</div>
                  <div class="stat-label">🤒 โรคที่พบมากที่สุด</div>
              </div>
              <div class="stat-card">
                  <div class="stat-value">${topBloodType}</div>
                  <div class="stat-label">🩸 กรุ๊ปเลือดที่พบมากสุด</div>
              </div>
            `;
          } else {
             throw new Error("ข้อมูลจาก API ไม่ถูกต้อง");
          }

        } catch (error) {
          console.error("Error loading stats:", error);
          statsGrid.innerHTML = `
            <div class="stat-card">
                <div class="stat-value">1,234</div>
                <div class="stat-label">👥 ผู้ป่วยทั้งหมด</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">45 ปี</div>
                <div class="stat-label">🎂 อายุเฉลี่ยผู้ป่วย</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" style="font-size: 1.8em;">Cancer</div>
                <div class="stat-label">🤒 โรคที่พบมากที่สุด</div>
            </div>
            <div class="stat-card">
                <div class="stat-value">O+</div>
                <div class="stat-label">🩸 กรุ๊ปเลือดที่พบมากสุด</div>
            </div>
          `;
        }
      }

      // Preview image before upload
      function previewImage(event) {
        const file = event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = function (e) {
            const preview = document.getElementById("imagePreview");
            preview.src = e.target.result;
            preview.style.display = "block";
          };
          reader.readAsDataURL(file);
        }
      }

      // Analyze medical image
      // Analyze medical image
      async function analyzeImage() {
        const fileInput = document.getElementById("imageFile");
        const analysisType = document.getElementById("analysisType").value;
        const resultDiv = document.getElementById("analysisResult");

        if (!fileInput.files[0]) {
          resultDiv.innerHTML =
            '<div class="alert alert-error">❌ กรุณาเลือกไฟล์รูปภาพ</div>';
          return;
        }

        resultDiv.innerHTML = '<div class="loader"></div>';

        // ปรับประเภทให้ตรงกับ Backend (xray, blood, brain)
        let backendType = analysisType.toLowerCase();
        if (backendType.includes("x-ray")) backendType = "xray";
        
        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        // แก้ไขชื่อคีย์ให้ตรงกับ Backend ที่รอรับ (image_type)
        formData.append("image_type", backendType);

        try {
          const response = await fetch(`${API_URL}/analyze`, {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          // ตรวจสอบว่า Backend ตอบกลับมาว่า Success หรือไม่
          if (data.success) {
            let resultDetails = "";

            // แยกการแสดงผลตามประเภทของภาพ เนื่องจาก Backend ส่งข้อมูลมาโครงสร้างต่างกัน
            if (data.type === "blood") {
              // แสดงผลสำหรับการนับเม็ดเลือด
              let cellList = "<ul style='margin-left: 20px; margin-bottom: 10px;'>";
              for (const [cellName, count] of Object.entries(data.cell_counts || {})) {
                cellList += `<li>${cellName}: <strong>${count}</strong> เซลล์</li>`;
              }
              cellList += "</ul>";

              resultDetails = `
                <p><strong>จำนวนเซลล์ที่พบทั้งหมด:</strong> ${data.total_cells || 0} เซลล์</p>
                <p><strong>รายละเอียด:</strong></p>
                ${cellList}
              `;
            } else {
              // แสดงผลสำหรับ X-ray และ Brain CT
              resultDetails = `
                <p><strong>ผลการตรวจ:</strong> <span style="color: var(--primary-dark); font-weight: bold; font-size: 1.1em;">${data.result || "-"}</span></p>
                <p><strong>ความมั่นใจ (Confidence):</strong> ${data.confidence || "-"}</p>
              `;
            }

            resultDiv.innerHTML = `
              <div class="result-box">
                  <h3 style="color: var(--primary-color); margin-bottom: 15px;">📋 ผลการวิเคราะห์จาก AI</h3>
                  <p><strong>ประเภท:</strong> ${analysisType}</p>
                  ${resultDetails}
                  <div class="alert alert-success" style="margin-top: 15px;">✅ วิเคราะห์เสร็จสมบูรณ์</div>
              </div>
            `;
          } else {
            // กรณี Backend ส่ง success: False กลับมาพร้อมบอก error
            throw new Error(data.error || "Model ไม่สามารถวิเคราะห์ภาพได้");
          }

        } catch (error) {
          console.error("Analysis Error:", error);
          // เอา Mock Result ออก และแสดงเป็น Error แจ้งเตือนจริงๆ
          resultDiv.innerHTML = `
              <div class="alert alert-error">
                  ❌ เกิดข้อผิดพลาด: ${error.message || "ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์วิเคราะห์ผลได้"}
              </div>
          `;
        }
      }

      // Send chat message
      // Send chat message
      async function sendMessage() {
        const input = document.getElementById("chatInput");
        const message = input.value.trim();

        if (!message) return;

        const messagesDiv = document.getElementById("chatMessages");

        // Add user message
        messagesDiv.innerHTML += `<div class="message user">${message}</div>`;
        input.value = "";
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        // Add loading indicator
        const loadingId = "loading_" + Date.now();
        messagesDiv.innerHTML += `<div id="${loadingId}" class="message bot">กำลังพิมพ์...</div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        // 🟢 เปลี่ยนมาใช้ FormData ให้ตรงกับที่ Backend (Form(...)) ต้องการ
        const formData = new FormData();
        formData.append("message", message);
        formData.append("session_id", sessionId);

        try {
          const response = await fetch(`${API_URL}/chat`, {
            method: "POST",
            // 🟢 ลบ headers: {"Content-Type": "application/json"} ออก เพราะ fetch จะจัดการให้เองเมื่อส่ง FormData
            body: formData,
          });

          const data = await response.json();
          document.getElementById(loadingId).remove();

          if (data.success) {
              messagesDiv.innerHTML += `<div class="message bot">${data.response || "ขอบคุณสำหรับคำถามครับ"}</div>`;
          } else {
              throw new Error(data.error || "API Error");
          }
          
        } catch (error) {
          console.error("Chat Error:", error);
          document.getElementById(loadingId).remove();

          // Mock AI response if API fails
          const mockResponses = [
            "ขอบคุณสำหรับคำถามครับ จากอาการที่บอกมา แนะนำให้พักผ่อนให้เพียงพอและดื่มน้ำมากๆ ครับ",
            "ตามที่เล่ามา อาจเป็นอาการทั่วไป แต่หากอาการไม่ดีขึ้นใน 2-3 วัน ควรพบแพทย์ครับ",
            "ผมเข้าใจความกังวลของคุณ แนะนำให้ตรวจสุขภาพประจำปีเพื่อความแน่ใจครับ",
          ];
          const randomResponse =
            mockResponses[Math.floor(Math.random() * mockResponses.length)];
          messagesDiv.innerHTML += `<div class="message bot">${randomResponse}</div>`;
        }

        messagesDiv.scrollTop = messagesDiv.scrollHeight;
      }

      // Search patients
      async function searchPatients() {
        const query = document.getElementById("searchQuery").value.trim();
        const searchType = document.getElementById("searchType").value; // ดึงค่าจาก Dropdown
        const resultsDiv = document.getElementById("searchResults");

        if (!query) {
          resultsDiv.innerHTML = '<div class="alert alert-error">❌ กรุณาใส่คำค้นหา</div>';
          return;
        }

        resultsDiv.innerHTML = '<div class="loader"></div>';

        const formData = new FormData();
        formData.append("search_query", query);
        formData.append("search_type", searchType); // ส่งประเภทการค้นหาไปให้ Backend

        try {
          const response = await fetch(`${API_URL}/patient/search`, {
            method: "POST",
            body: formData,
          });

          const data = await response.json();

          if (data.results && data.results.length > 0) {
            // เพิ่ม style overflow-x: auto เพื่อให้เลื่อนซ้ายขวาได้ถ้าตารางยาว
            let tableHTML = `
                <div class="table-container" style="overflow-x: auto;">
                    <table style="white-space: nowrap;">
                        <thead>
                            <tr>
                                <th>ชื่อ-นามสกุล</th>
                                <th>อายุ</th>
                                <th>เพศ</th>
                                <th>กรุ๊ปเลือด</th>
                                <th>โรคประจำตัว</th>
                                <th>วันที่เข้ารักษา</th>
                                <th>แพทย์ผู้ดูแล</th>
                                <th>โรงพยาบาล</th>
                                <th>ผลการตรวจ</th>
                            </tr>
                        </thead>
                        <tbody>
            `;

            data.results.forEach((patient) => {
              // ตกแต่งสีผลการตรวจ (Normal = เขียว, Abnormal = แดง)
              let testResultStyle = "";
              if (patient["Test Results"] === "Normal") testResultStyle = "color: var(--success-color); font-weight: bold;";
              else if (patient["Test Results"] === "Abnormal") testResultStyle = "color: var(--danger-color); font-weight: bold;";

              // อ้างอิงชื่อคอลัมน์ให้ตรงกับไฟล์ CSV แบบเป๊ะๆ
              tableHTML += `
                    <tr>
                        <td>${patient.Name || "-"}</td>
                        <td>${patient.Age || "-"}</td>
                        <td>${patient.Gender || "-"}</td>
                        <td><strong>${patient["Blood Type"] || "-"}</strong></td>
                        <td>${patient["Medical Condition"] || "-"}</td>
                        <td>${patient["Date of Admission"] || "-"}</td>
                        <td>${patient.Doctor || "-"}</td>
                        <td>${patient.Hospital || "-"}</td>
                        <td style="${testResultStyle}">${patient["Test Results"] || "-"}</td>
                    </tr>
                `;
            });

            tableHTML += "</tbody></table></div>";
            resultsDiv.innerHTML = tableHTML;
          } else {
            resultsDiv.innerHTML = '<div class="alert alert-error">❌ ไม่พบข้อมูลผู้ป่วยที่ตรงกับเงื่อนไข</div>';
          }
        } catch (error) {
          console.error("Error:", error);
          resultsDiv.innerHTML = '<div class="alert alert-error">❌ เกิดข้อผิดพลาดในการเชื่อมต่อกับเซิร์ฟเวอร์</div>';
        }
      }
      // Initialize dashboard on page load
      window.onload = function () {
        loadDashboard();
      };
    </script>
  </body>
</html>
